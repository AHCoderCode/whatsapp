name: Build native Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Use current command-line tools to avoid the SDK XML v4 warning.
          cmdline-tools-version: "15859902"
          # The legacy "tools" SDK package is discontinued; request only supported packages.
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Write Firebase Android configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "Missing GitHub Actions secret GOOGLE_SERVICES_JSON."
            exit 1
          fi
          mkdir -p android-native/app
          printf '%s' "$GOOGLE_SERVICES_JSON" > android-native/app/google-services.json
          python3 -m json.tool android-native/app/google-services.json >/dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        working-directory: android-native
        run: gradle --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-native-debug-apk
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
