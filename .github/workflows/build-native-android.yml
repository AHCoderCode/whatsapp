name: Build native Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

# A newer push supersedes an older build so older jobs cannot race to publish the latest release.
concurrency:
  group: whatsapp-native-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run source checks before building an update
        run: |
          node --check app.js
          node --check backend.js
          node --check calls.js
          node --check sw.js
          node --check updater.js
          node tests/smoke-check.mjs

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "15859902"
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Write and validate Firebase Android configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Missing GitHub Actions secret GOOGLE_SERVICES_JSON."
            echo "Add the complete contents of Firebase's google-services.json file as this secret."
            exit 1
          fi

          mkdir -p android-native/app
          printf '%s' "$GOOGLE_SERVICES_JSON" > android-native/app/google-services.json

          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path

          config_path = Path("android-native/app/google-services.json")
          try:
              config = json.loads(config_path.read_text(encoding="utf-8"))
          except Exception:
              print("::error::GOOGLE_SERVICES_JSON is not valid JSON. Replace it with the complete google-services.json file downloaded from Firebase.")
              sys.exit(1)

          if not isinstance(config, dict) or not isinstance(config.get("project_info"), dict):
              if isinstance(config, dict) and (config.get("type") == "service_account" or "private_key" in config or "private_key_id" in config):
                  print("::error::GOOGLE_SERVICES_JSON contains a Firebase service-account key. That is the wrong file. Use the Android app's google-services.json instead. Keep the service-account key only in Supabase.")
              else:
                  print("::error::GOOGLE_SERVICES_JSON is missing the top-level project_info object. Replace it with the complete google-services.json downloaded from Firebase Project settings → Your apps → Android app.")
              sys.exit(1)

          clients = config.get("client")
          if not isinstance(clients, list):
              print("::error::This google-services.json has no client list. Download the configuration for the registered Android app.")
              sys.exit(1)

          expected_package = "com.ahcodercode.whatsapp"
          packages = []
          for client in clients:
              package_name = (
                  client.get("client_info", {})
                  .get("android_client_info", {})
                  .get("package_name")
              )
              if package_name:
                  packages.append(package_name)

          if expected_package not in packages:
              print("::error::The Firebase configuration does not include Android package com.ahcodercode.whatsapp. Register that exact package in Firebase, then download a fresh google-services.json and update the GOOGLE_SERVICES_JSON GitHub secret.")
              sys.exit(1)

          print("Firebase Android configuration validated for com.ahcodercode.whatsapp.")
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        working-directory: android-native
        run: gradle --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-native-debug-apk
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Check stable release signing secrets
        id: signing
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$ANDROID_SIGNING_KEYSTORE_BASE64" ] || [ -z "$ANDROID_SIGNING_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_SIGNING_KEY_ALIAS" ] || [ -z "$ANDROID_SIGNING_KEY_PASSWORD" ]; then
            echo "::error::Permanent Android signing is not configured. Add all four ANDROID_SIGNING_* repository Actions secrets before publishing updates."
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Prepare permanent release keystore
        if: steps.signing.outputs.configured == 'true'
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > android-native/app/whatsapp-release.keystore
          test -s android-native/app/whatsapp-release.keystore

      - name: Validate permanent release keystore and alias
        if: steps.signing.outputs.configured == 'true'
        env:
          ANDROID_SIGNING_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
        run: |
          keytool -list -keystore android-native/app/whatsapp-release.keystore \
            -storepass "$ANDROID_SIGNING_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_SIGNING_KEY_ALIAS" >/dev/null
          echo "Permanent release keystore and alias validated."

      - name: Build permanent signed release APK
        if: steps.signing.outputs.configured == 'true'
        id: release
        env:
          ANDROID_SIGNING_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          RUN_NUMBER: ${{ github.run_number }}
        working-directory: android-native
        shell: bash
        run: |
          WA_VERSION_CODE=$((1000 + RUN_NUMBER))
          WA_VERSION_NAME="1.4.$RUN_NUMBER"
          gradle --no-daemon -PwaVersionCode="$WA_VERSION_CODE" -PwaVersionName="$WA_VERSION_NAME" assembleRelease
          mkdir -p app/build/outputs/whatsapp-release
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/whatsapp-release/whatsapp.apk
          SHA256="$(sha256sum app/build/outputs/whatsapp-release/whatsapp.apk | cut -d ' ' -f1)"
          echo "version_code=$WA_VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$WA_VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Upload permanent signed APK artifact
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-native-release-apk
          path: android-native/app/build/outputs/whatsapp-release/whatsapp.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish updateable GitHub Release
        if: steps.signing.outputs.configured == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: WhatsApp Android ${{ steps.release.outputs.version_name }}
          target_commitish: main
          make_latest: true
          prerelease: false
          generate_release_notes: false
          body: |
            WhatsApp Android signed update.

            Version: ${{ steps.release.outputs.version_name }}
            Version code: ${{ steps.release.outputs.version_code }}
            APK SHA-256: ${{ steps.release.outputs.sha256 }}

            Built from commit ${{ github.sha }}. The in-app updater checks the checksum before opening Android's installer.
          files: android-native/app/build/outputs/whatsapp-release/whatsapp.apk
          fail_on_unmatched_files: true
