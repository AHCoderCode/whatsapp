<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#00a884">
  <meta name="color-scheme" content="light">
  <meta name="description" content="A responsive WhatsApp-style chat-list interface preview.">
  <title>WhatsApp</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <style>
    :root {
      font-family: "Segoe UI", Arial, Helvetica, sans-serif;
      color: #111b21;
      background: #f0f2f5;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      --wa-green: #00a884;
      --wa-dark-green: #008069;
      --wa-text: #111b21;
      --wa-muted: #667781;
      --wa-border: #e9edef;
      --wa-header: #f0f2f5;
      --wa-hover: #f5f6f6;
      --wa-active: #f0f2f5;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { min-width: 320px; overflow: hidden; }
    button, input { font: inherit; }
    button { color: inherit; }
    svg { display: block; }
    .app-shell { width: 100%; height: 100dvh; background: #fff; overflow: hidden; }
    .workspace { width: 100%; height: 100%; min-width: 0; display: grid; grid-template-columns: 64px 420px minmax(0, 1fr); }
    .app-rail {
      min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: space-between;
      padding: 16px 0 max(14px, env(safe-area-inset-bottom)); background: #f7f8fa; border-right: 1px solid #e6e9eb;
    }
    .rail-group { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; }
    .rail-icon {
      width: 44px; height: 44px; padding: 0; position: relative; display: grid; place-items: center;
      border: 0; border-radius: 50%; background: transparent; color: #54656f;
    }
    .rail-icon svg { width: 23px; height: 23px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .rail-icon.active { color: #111b21; background: #e9edef; }
    .rail-icon.active:before { content: ""; position: absolute; left: -10px; top: 10px; height: 24px; width: 3px; border-radius: 0 3px 3px 0; background: var(--wa-green); }
    .rail-badge { position: absolute; top: 3px; right: 2px; min-width: 17px; height: 17px; padding: 0 4px; display: grid; place-items: center; border-radius: 9px; background: var(--wa-green); color: #fff; font: 700 10px/1 Arial, sans-serif; border: 2px solid #f7f8fa; }
    .rail-divider { width: 30px; height: 1px; background: #dfe3e5; margin: 3px 0 4px; }
    .profile-avatar { width: 31px; height: 31px; border-radius: 50%; display: grid; place-items: center; color: #28654e; background: #cfe5d9; font-size: 10px; font-weight: 700; border: 2px solid #fff; }
    .chat-pane { min-width: 0; min-height: 0; display: flex; flex-direction: column; border-right: 1px solid #dfe3e5; background: #fff; }
    .pane-header { flex: 0 0 64px; height: 64px; padding: 0 16px 0 20px; display: flex; align-items: center; justify-content: space-between; gap: 8px; background: #fff; }
    .panel-title { margin: 0; min-width: 0; font-size: 22px; font-weight: 700; letter-spacing: -.35px; color: #111b21; line-height: 1.2; }
    .mobile-title { display: none; }
    .header-actions { display: flex; align-items: center; gap: 7px; }
    .icon-button {
      flex: 0 0 auto; width: 38px; height: 38px; display: grid; place-items: center; padding: 0;
      border: 0; border-radius: 50%; color: #54656f; background: transparent;
    }
    .icon-button svg { width: 23px; height: 23px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .icon-button:focus-visible, .filter-chip:focus-visible { outline: 2px solid #008069; outline-offset: 2px; }
    .mobile-header-actions { display: none; }
    .search-area { flex: 0 0 auto; padding: 0 12px 8px; display: flex; align-items: center; gap: 8px; }
    .search-box {
      flex: 1; min-width: 0; height: 36px; border-radius: 8px; display: flex; align-items: center; gap: 28px;
      padding: 0 12px; background: #f0f2f5; color: #667781;
    }
    .search-box svg { flex: 0 0 auto; width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }
    .search-box input { width: 100%; min-width: 0; border: 0; outline: 0; padding: 0; background: transparent; color: #667781; font-size: 14px; }
    .search-box input::placeholder { color: #667781; opacity: 1; }
    .search-filter-button { width: 34px; height: 36px; }
    .search-filter-button svg { width: 21px; height: 21px; }
    .filter-row { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 0 12px 12px; overflow-x: auto; scrollbar-width: none; }
    .filter-row::-webkit-scrollbar { display: none; }
    .filter-chip {
      height: 32px; flex: 0 0 auto; padding: 0 12px; border: 0; border-radius: 18px;
      background: #f0f2f5; color: #54656f; font-size: 13px; font-weight: 500; white-space: nowrap;
    }
    .filter-chip[aria-pressed="true"] { background: #d9fdd3; color: #008069; }
    .filter-chip .chip-count { margin-left: 5px; opacity: .85; font-size: 11px; }
    .list-scroll { min-height: 0; flex: 1; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: #c9d1d5 transparent; }
    .list-scroll::-webkit-scrollbar { width: 6px; }
    .list-scroll::-webkit-scrollbar-thumb { background: #c9d1d5; }
    .archived-row { height: 62px; padding: 0 18px 0 22px; display: flex; align-items: center; gap: 21px; border-bottom: 1px solid #f0f2f2; color: #111b21; font-size: 14px; }
    .archived-row svg { width: 21px; height: 21px; flex: 0 0 auto; stroke: #667781; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .archived-count { margin-left: auto; font-size: 12px; color: #00a884; }
    .chat-row { position: relative; height: 76px; min-width: 0; padding: 0 12px; display: flex; align-items: center; gap: 13px; background: #fff; }
    .chat-row:after { position: absolute; content: ""; height: 1px; right: 0; bottom: 0; left: 85px; background: #f0f2f2; }
    .avatar { width: 49px; height: 49px; flex: 0 0 49px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 14px; line-height: 1; font-weight: 600; letter-spacing: .1px; overflow: hidden; position: relative; }
    .avatar svg { width: 25px; height: 25px; stroke: #fff; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .avatar-1 { background: linear-gradient(145deg,#ddaf96,#a35f4c); }
    .avatar-2 { background: linear-gradient(145deg,#7cb9a1,#2f7668); }
    .avatar-3 { background: linear-gradient(145deg,#b6a6e6,#6b5cad); }
    .avatar-4 { background: linear-gradient(145deg,#e5c16c,#a36f36); }
    .avatar-5 { background: linear-gradient(145deg,#7fc2d7,#337f9a); }
    .avatar-6 { background: linear-gradient(145deg,#e6a0bb,#a34d77); }
    .avatar-7 { background: linear-gradient(145deg,#a9ca75,#557d37); }
    .avatar-8 { background: linear-gradient(145deg,#aebfc9,#596f7e); }
    .avatar-9 { background: linear-gradient(145deg,#efb67a,#bb6849); }
    .avatar-10 { background: linear-gradient(145deg,#9ac7aa,#427e5b); }
    .avatar-11 { background: linear-gradient(145deg,#d5a1a2,#8b4c50); }
    .avatar-12 { background: linear-gradient(145deg,#99b4e7,#4d6ba3); }
    .chat-copy { align-self: stretch; min-width: 0; flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 5px; padding-right: 1px; }
    .chat-line { width: 100%; min-width: 0; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .chat-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 16px; line-height: 20px; font-weight: 400; color: #111b21; }
    .chat-time { flex: 0 0 auto; white-space: nowrap; font-size: 11px; line-height: 15px; color: #667781; }
    .chat-time.unread-time { color: #00a884; }
    .chat-preview { flex: 1; min-width: 0; display: flex; align-items: center; gap: 4px; color: #667781; font-size: 13px; line-height: 18px; }
    .preview-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .preview-check { flex: 0 0 17px; width: 17px; height: 17px; color: #53bdeb; }
    .preview-check svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .chat-meta { display: flex; flex: 0 0 auto; align-items: center; gap: 5px; }
    .meta-icon { width: 14px; height: 14px; color: #8696a0; }
    .meta-icon svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .unread-badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; display: grid; place-items: center; background: #25d366; color: #fff; font-size: 11px; font-weight: 700; }
    .empty-filter { min-height: 180px; padding: 34px 24px; text-align: center; color: #667781; font-size: 14px; line-height: 1.5; }
    .desktop-download { flex: 0 0 auto; min-height: 58px; display: flex; align-items: center; gap: 10px; padding: 8px 18px; background: #f7f8fa; border-top: 1px solid #edf0f1; color: #54656f; font-size: 13px; }
    .download-mark { width: 30px; height: 30px; flex: 0 0 auto; object-fit: contain; }
    .desktop-download strong { display: block; margin-bottom: 2px; font-size: 13px; font-weight: 500; color: #111b21; }
    .desktop-download span { display: block; color: #667781; font-size: 11px; }
    .welcome-pane {
      position: relative; min-width: 0; min-height: 0; overflow: hidden; display: flex; flex-direction: column;
      align-items: center; justify-content: center; background-color: #f7f8fa; border-bottom: 6px solid #25d366;
    }
    .welcome-pane:before { content: ""; pointer-events: none; position: absolute; inset: 0; opacity: .26; background-image: radial-gradient(#d9dfe2 .75px, transparent .75px); background-size: 19px 19px; }
    .welcome-content { position: relative; max-width: 510px; padding: 28px 30px; display: flex; flex-direction: column; align-items: center; text-align: center; }
    .welcome-art { display: block; width: min(310px, 36vw); height: auto; margin: 0 0 27px; }
    .welcome-title { margin: 0 0 11px; color: #41525d; font-size: 31px; line-height: 1.25; font-weight: 300; letter-spacing: -.7px; }
    .welcome-copy { max-width: 415px; margin: 0; color: #667781; font-size: 14px; line-height: 1.7; }
    .welcome-divider { width: 100%; height: 1px; margin: 26px 0 17px; background: #e2e6e8; }
    .preview-caption { display: flex; align-items: center; justify-content: center; gap: 7px; color: #8696a0; font-size: 12px; line-height: 1.5; }
    .preview-caption svg { width: 14px; height: 14px; flex: 0 0 auto; stroke: currentColor; fill: none; stroke-width: 1.8; }
    .welcome-footer { position: absolute; left: 0; right: 0; bottom: 24px; display: flex; justify-content: center; align-items: center; gap: 6px; color: #8696a0; font-size: 12px; }
    .welcome-footer svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 1.8; }
    .mobile-nav { display: none; }
    @media (min-width: 1500px) {
      .workspace { grid-template-columns: 64px 440px minmax(0, 1fr); }
      .chat-row { height: 78px; }
      .chat-row:after { left: 87px; }
      .welcome-art { width: 325px; }
    }
    @media (max-width: 1100px) and (min-width: 701px) {
      .workspace { grid-template-columns: 56px minmax(300px, 360px) minmax(0, 1fr); }
      .rail-icon { width: 42px; height: 42px; }
      .welcome-content { padding: 22px; }
      .welcome-art { width: min(240px, 30vw); margin-bottom: 20px; }
      .welcome-title { font-size: 27px; }
      .welcome-copy { font-size: 13px; }
    }
    @media (max-width: 700px) {
      body { background: #fff; }
      .workspace { display: flex; flex-direction: column; }
      .app-rail, .welcome-pane, .desktop-actions, .desktop-download { display: none; }
      .chat-pane { flex: 1; min-height: 0; border: 0; }
      .pane-header { flex-basis: 58px; height: 58px; padding: 0 12px 0 16px; }
      .panel-title { font-size: 23px; letter-spacing: -.4px; }
      .desktop-title { display: none; }
      .mobile-title { display: inline; }
      .mobile-header-actions { display: flex; align-items: center; gap: 3px; }
      .icon-button { width: 38px; height: 38px; }
      .search-area { padding: 2px 12px 8px; gap: 5px; }
      .search-box { gap: 22px; }
      .search-filter-button { display: none; }
      .filter-row { padding: 0 12px 11px; gap: 8px; }
      .filter-chip { height: 32px; padding: 0 12px; }
      .list-scroll { padding-bottom: 4px; }
      .archived-row { height: 58px; padding-left: 18px; gap: 19px; }
      .chat-row { height: 76px; padding: 0 12px; gap: 12px; }
      .avatar { width: 50px; height: 50px; flex-basis: 50px; }
      .chat-row:after { left: 74px; }
      .chat-name { font-size: 16px; }
      .chat-preview { font-size: 13px; }
      .mobile-nav {
        flex: 0 0 auto; min-height: calc(60px + env(safe-area-inset-bottom)); padding: 0 4px env(safe-area-inset-bottom);
        display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: stretch;
        background: #f7f8fa; border-top: 1px solid #edf0f1;
      }
      .mobile-tab { position: relative; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 3px; min-width: 0; padding: 5px 0; color: #667781; font-size: 11px; font-weight: 500; }
      .mobile-tab svg { width: 23px; height: 23px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .mobile-tab.active { color: #008069; }
      .mobile-tab.active .mobile-tab-icon { width: 64px; height: 29px; margin: -2px 0 0; border-radius: 18px; display: grid; place-items: center; background: #d9fdd3; }
      .mobile-tab.active svg { width: 21px; height: 21px; }
      .mobile-tab-badge { position: absolute; left: calc(50% + 8px); top: 6px; width: 16px; height: 16px; display: grid; place-items: center; border-radius: 9px; background: #25d366; color: #fff; font-size: 10px; line-height: 1; border: 1px solid #f7f8fa; }
    }
    @media (max-width: 380px) {
      .pane-header { padding-left: 12px; padding-right: 8px; }
      .panel-title { font-size: 22px; }
      .mobile-header-actions { gap: 0; }
      .icon-button { width: 35px; }
      .filter-row { gap: 6px; padding-left: 10px; padding-right: 10px; }
      .filter-chip { padding: 0 10px; font-size: 12px; }
      .chat-row { padding: 0 9px; gap: 10px; }
      .chat-row:after { left: 69px; }
      .avatar { width: 48px; height: 48px; flex-basis: 48px; }
      .chat-name { font-size: 15px; }
    }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; animation: none !important; transition: none !important; } }
  </style>
</head>

  <main class="app-shell" aria-label="WhatsApp interface preview">
    <div class="workspace">
      <aside class="app-rail" aria-label="WhatsApp navigation preview">
        <nav class="rail-group" aria-label="Main sections">
          <button class="rail-icon active" type="button" aria-label="Chats" title="Chats">
            <svg viewBox="0 0 24 24"><use href="#i-chat"/></svg><span class="rail-badge">3</span>
          </button>
          <button class="rail-icon" type="button" aria-label="Updates" title="Updates"><svg viewBox="0 0 24 24"><use href="#i-status"/></svg></button>
          <button class="rail-icon" type="button" aria-label="Communities" title="Communities"><svg viewBox="0 0 24 24"><use href="#i-communities"/></svg></button>
          <button class="rail-icon" type="button" aria-label="Channels" title="Channels"><svg viewBox="0 0 24 24"><use href="#i-channels"/></svg></button>
          <button class="rail-icon" type="button" aria-label="Calls" title="Calls"><svg viewBox="0 0 24 24"><use href="#i-phone"/></svg></button>
          <div class="rail-divider"></div>
          <button class="rail-icon" type="button" aria-label="Starred messages" title="Starred messages"><svg viewBox="0 0 24 24"><use href="#i-star"/></svg></button>
          <button class="rail-icon" type="button" aria-label="Archived chats" title="Archived chats"><svg viewBox="0 0 24 24"><use href="#i-archive"/></svg></button>
          <button class="rail-icon" type="button" aria-label="Locked chats" title="Locked chats"><svg viewBox="0 0 24 24"><use href="#i-locked"/></svg></button>
        </nav>
        <div class="rail-group">
          <button class="rail-icon" type="button" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24"><use href="#i-settings"/></svg></button>
          <button class="rail-icon" type="button" aria-label="Profile" title="Profile"><span class="profile-avatar">ME</span></button>
        </div>
      </aside>

      <section class="chat-pane" aria-label="Chat list">
        <header class="pane-header">
          <h1 class="panel-title"><span class="desktop-title">Chats</span><span class="mobile-title">WhatsApp</span></h1>
          <div class="header-actions desktop-actions" aria-label="Chat list actions">
            <button class="icon-button" type="button" aria-label="New chat" title="New chat"><svg viewBox="0 0 24 24"><use href="#i-new"/></svg></button>
            <button class="icon-button" type="button" aria-label="More options" title="More options"><svg viewBox="0 0 24 24"><use href="#i-dots"/></svg></button>
          </div>
          <div class="header-actions mobile-header-actions" aria-label="Chat list actions">
            <button class="icon-button" type="button" aria-label="Camera" title="Camera"><svg viewBox="0 0 24 24"><use href="#i-camera"/></svg></button>
            <button class="icon-button" type="button" aria-label="New chat" title="New chat"><svg viewBox="0 0 24 24"><use href="#i-new"/></svg></button>
            <button class="icon-button" type="button" aria-label="More options" title="More options"><svg viewBox="0 0 24 24"><use href="#i-dots"/></svg></button>
          </div>
        </header>

        <div class="search-area">
          <label class="search-box">
            <svg viewBox="0 0 24 24"><use href="#i-search"/></svg>
            <input type="text" placeholder="Search or start a new chat" aria-label="Search or start a new chat" readonly>
          </label>
          <button class="icon-button search-filter-button" type="button" aria-label="Search filters" title="Search filters"><svg viewBox="0 0 24 24"><use href="#i-sliders"/></svg></button>
        </div>

        <div class="filter-row" role="group" aria-label="Filter chats">
          <button class="filter-chip" type="button" data-filter="all" aria-pressed="true">All</button>
          <button class="filter-chip" type="button" data-filter="unread" aria-pressed="false">Unread</button>
          <button class="filter-chip" type="button" data-filter="favorites" aria-pressed="false">Favorites</button>
          <button class="filter-chip" type="button" data-filter="groups" aria-pressed="false">Groups</button>
          <button class="icon-button filter-more" type="button" aria-label="More chat lists" title="More chat lists"><svg viewBox="0 0 24 24"><use href="#i-dots"/></svg></button>
        </div>

        <div class="list-scroll">
          <div class="archived-row">
            <svg viewBox="0 0 24 24"><use href="#i-archive"/></svg><span>Archived</span><span class="archived-count">2</span>
          </div>
          <div id="chat-list" role="list" aria-label="Conversations">
            <div class="empty-filter">Loading chats…</div>
          </div>
        </div>

        <div class="desktop-download">
          <img class="download-mark" src="/icon.svg" alt="">
          <div><strong>Get WhatsApp for Windows</strong><span>Make calls, share your screen and get more done</span></div>
        </div>

        <nav class="mobile-nav" aria-label="WhatsApp sections">
          <button class="mobile-tab" type="button" aria-label="Updates" title="Updates"><span class="mobile-tab-icon"><svg viewBox="0 0 24 24"><use href="#i-status"/></svg></span><span>Updates</span></button>
          <button class="mobile-tab" type="button" aria-label="Communities" title="Communities"><span class="mobile-tab-icon"><svg viewBox="0 0 24 24"><use href="#i-communities"/></svg></span><span>Communities</span></button>
          <button class="mobile-tab active" type="button" aria-label="Chats" title="Chats"><span class="mobile-tab-icon"><svg viewBox="0 0 24 24"><use href="#i-chat"/></svg></span><span>Chats</span><span class="mobile-tab-badge">3</span></button>
          <button class="mobile-tab" type="button" aria-label="Calls" title="Calls"><span class="mobile-tab-icon"><svg viewBox="0 0 24 24"><use href="#i-phone"/></svg></span><span>Calls</span></button>
        </nav>
      </section>

      <section class="welcome-pane" aria-label="No conversation selected">
        <div class="welcome-content">
          <svg class="welcome-art" viewBox="0 0 320 250" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <ellipse cx="161" cy="220" rx="112" ry="9" fill="#e0e6e8"/>

            <path d="M233 60c0-17 15-31 34-31 18 0 33 14 33 31s-15 31-33 31c-5 0-9-1-13-3l-13 7 4-13c-7-6-12-13-12-22Z" fill="#e3e8eb"/>
            <path d="M263 49c-2-2-3-1-4 0-2 2-3 5-2 8 2 5 6 9 11 12 4 2 7 3 9 2 2-1 3-3 3-4 0-1 0-2-2-2l-5-2c-1 0-2 0-2 1l-2 2c-1 1-1 1-2 0-2-1-4-3-6-5-1-2-2-3-2-4 0-1 0-1 1-2l2-2c1-1 1-1 0-2l-1-2Z" fill="#fff"/>
            <path d="M34 185h35M50 168v34M248 157h30M263 142v30" stroke="#c2d2d8" stroke-width="3" stroke-linecap="round"/>
            <circle cx="104" cy="50" r="5" fill="#b8dccc"/><circle cx="222" cy="112" r="4" fill="#c6d8df"/><circle cx="93" cy="208" r="4" fill="#b7d9c8"/>
          </svg>
          <h2 class="welcome-title">WhatsApp Web</h2>
          <p class="welcome-copy">Send and receive messages with ease, right from your computer.</p>
          <div class="welcome-divider"></div>
          <div class="preview-caption"><svg viewBox="0 0 24 24"><use href="#i-chat"/></svg><span>Frontend preview · Chats aren’t connected yet</span></div>
        </div>
        <div class="welcome-footer"><svg viewBox="0 0 24 24"><use href="#i-lock"/></svg><span>WhatsApp-style interface preview</span></div>
      </section>
    </div>
  </main>
  <script src="/app.js" defer></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
    }
  </script>
</body>
