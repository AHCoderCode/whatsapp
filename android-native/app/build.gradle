plugins {
    id "com.android.application"
    id "com.google.gms.google-services"
}
android {
    namespace "com.ahcodercode.whatsapp"
    compileSdk 36
    defaultConfig {
        applicationId "com.ahcodercode.whatsapp"
        minSdk 24
        targetSdk 35
        versionCode (providers.gradleProperty("waVersionCode").orNull ?: "4").toInteger()
        versionName (providers.gradleProperty("waVersionName").orNull ?: "1.3.0")
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            storeFile file("whatsapp-release.keystore")
            storePassword System.getenv("ANDROID_SIGNING_KEYSTORE_PASSWORD") ?: ""
            keyAlias System.getenv("ANDROID_SIGNING_KEY_ALIAS") ?: ""
            keyPassword System.getenv("ANDROID_SIGNING_KEY_PASSWORD") ?: ""
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation platform("com.google.firebase:firebase-bom:35.1.0")
    implementation "com.google.firebase:firebase-messaging"
    implementation "androidx.core:core:1.17.0"
}
